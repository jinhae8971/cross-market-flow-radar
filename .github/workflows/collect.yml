name: flow-radar-collect

# v2 (2026-09-23) 운영 원칙
#  · 발행사 공시(SSGA navhist)는 미국 세션 T의 값을 KST T+1 약 14:00에 올린다.
#    그래서 주 실행은 15:17 KST, 지연 대비 재시도 16:47, 누락분 따라잡기 08:17.
#    정각·30분은 GitHub 스케줄러 혼잡 슬롯이라 피한다(v1은 최대 5시간 20분 지연).
#  · 관측 저장은 항상 한다(commit: always). 발행 보류는 정상 종료이며 텔레그램은
#    상태 전환에만 반응한다. 워크플로우 자체 실패만 ops_alert.py가 알린다.
on:
  schedule:
    - cron: "17 6 * * 1-5"    # 평일 15:17 KST — 주 발송 슬롯
    - cron: "47 7 * * 1-5"    # 평일 16:47 KST — 공시 지연 재시도
    - cron: "17 23 * * 0-4"   # 평일 08:17 KST — 전일 누락분 따라잡기
  workflow_dispatch:
    inputs:
      seed:
        description: "한국 원천 이력을 깊게(100영업일) 다시 받는다"
        required: false
        default: "false"
      force_notify:
        description: "중복·야간 가드를 무시하고 현재 상태 메시지를 발송한다"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: flow-radar-collect
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt

      # 테스트를 같은 잡에 둔다 — 별도 잡이면 테스트 실패 시 수집 잡이 통째로
      # 건너뛰어져 실패 알림도 커밋도 없이 조용히 멈춘다(의존성 업데이트 사고 대비).
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect and build signals
        env:
          SEED: ${{ inputs.seed }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE }}
          TZ: "Asia/Seoul"
        run: |
          set -euo pipefail
          if [[ "${SEED:-false}" != "true" && "${SEED:-false}" != "false" ]]; then
            echo "::error::seed 입력은 true 또는 false만 허용됩니다"
            exit 1
          fi
          if [[ "${SEED:-false}" == "true" ]]; then
            python run.py --seed
          else
            python run.py
          fi

      - name: Telegram (state transitions only)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTIFY_FORCE: ${{ inputs.force_notify }}
          TZ: "Asia/Seoul"
        run: python notify.py

      - name: Crash alert (2nd consecutive failure, 20h cooldown)
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python ops_alert.py || true

      # 실패한 실행이어도 저장된 관측·상태는 커밋한다 — v1의 흡수 상태 재발 방지.
      - name: Commit data
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"; exit 0
          fi
          git commit -m "data: flow radar $(date +%F)"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((i * 5))
          done
          echo "::error::3회 시도 후에도 푸시 실패"; exit 1
